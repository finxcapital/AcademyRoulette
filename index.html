<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AcademyRoulette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0d;
    --bg-2:#131317;
    --felt:#0c2b23;
    --felt-2:#0f3a2e;
    --gold:#c9a227;
    --gold-light:#f0d27a;
    --gold-dark:#8a6d16;
    --cream:#f3ead9;
    --cream-dim:#c9bfae;
    --objection:#b23a34;
    --objection-light:#e4645a;
    --condition:#1f8f76;
    --condition-light:#3fd6b0;
    --panel:#17171b;
    --panel-line:#2a2a30;
    --shadow-deep: 0 30px 80px rgba(0,0,0,.65);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse 1200px 800px at 50% -10%, rgba(201,162,39,.10), transparent 60%),
      radial-gradient(ellipse 900px 700px at 85% 100%, rgba(31,143,118,.10), transparent 60%),
      radial-gradient(ellipse 900px 700px at 10% 100%, rgba(178,58,52,.08), transparent 60%),
      var(--bg);
    color:var(--cream);
    font-family:'Inter',sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:48px 20px 80px;
    overflow-x:hidden;
    position:relative;
  }

  body::before{
    content:"";
    position:fixed; inset:0;
    background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.55) 100%);
    pointer-events:none;
    z-index:0;
  }

  .stage{ position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; width:100%; max-width:720px; }

  header{ text-align:center; margin-bottom:6px; }
  .eyebrow{
    font-family:'Inter'; font-size:11px; letter-spacing:.32em; text-transform:uppercase;
    color:var(--gold-light); opacity:.75; margin:0 0 6px;
  }
  h1{
    font-family:'Cinzel', serif; font-weight:700; font-size:clamp(26px,4.4vw,40px);
    margin:0; letter-spacing:.02em;
    background:linear-gradient(180deg, var(--cream) 0%, var(--gold-light) 60%, var(--gold-dark) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 2px 24px rgba(201,162,39,.25);
  }

  .mode-wrap{ margin:28px 0 8px; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .mode-labels{ display:flex; justify-content:space-between; width:190px; font-family:'Inter'; font-size:11px; letter-spacing:.14em; text-transform:uppercase; }
  .mode-labels span{ opacity:.55; transition:opacity .35s, color .35s; }
  .mode-labels span.active{ opacity:1; }
  .mode-labels .lbl-obj.active{ color:var(--objection-light); }
  .mode-labels .lbl-cond.active{ color:var(--condition-light); }

  .pill{
    --pill-w:190px; --pill-h:64px; --thumb:52px;
    position:relative;
    width:var(--pill-w); height:var(--pill-h);
    border-radius:999px;
    background:linear-gradient(180deg,#1c1c20,#0f0f12);
    border:1px solid var(--panel-line);
    box-shadow:inset 0 2px 10px rgba(0,0,0,.6), inset 0 -1px 0 rgba(255,255,255,.03), 0 12px 30px rgba(0,0,0,.5);
    cursor:pointer;
    padding:6px;
    display:flex;
    align-items:center;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
    overflow:hidden;
  }
  .pill .icon-slot{
    position:relative; z-index:2;
    width:calc(var(--pill-h) - 12px); height:calc(var(--pill-h) - 12px);
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    flex:0 0 auto;
  }
  .pill .icon-slot svg{ width:24px; height:24px; transition:stroke .35s, opacity .35s, transform .35s; }
  .pill .icon-slot.left{ margin-right:auto; }
  .pill .icon-slot.right{ margin-left:auto; }

  .thumb{
    position:absolute; top:6px; left:6px;
    width:var(--thumb); height:var(--thumb);
    z-index:1;
    transform:translateX(0);
  }
  .pill.is-right .thumb{
    transform:translateX(calc(var(--pill-w) - var(--thumb) - 12px));
  }
  .thumb.slide-right{
    animation:slideRight .5s cubic-bezier(.3,.62,.35,1) forwards;
  }
  .thumb.slide-left{
    animation:slideLeft .5s cubic-bezier(.3,.62,.35,1) forwards;
  }
  @keyframes slideRight{
    0%  { transform:translateX(0); }
    58% { transform:translateX(calc((var(--pill-w) - var(--thumb) - 12px) * 1.1)); }
    78% { transform:translateX(calc((var(--pill-w) - var(--thumb) - 12px) * 0.95)); }
    100%{ transform:translateX(calc(var(--pill-w) - var(--thumb) - 12px)); }
  }
  @keyframes slideLeft{
    0%  { transform:translateX(calc(var(--pill-w) - var(--thumb) - 12px)); }
    58% { transform:translateX(calc((var(--pill-w) - var(--thumb) - 12px) * -0.1)); }
    78% { transform:translateX(calc((var(--pill-w) - var(--thumb) - 12px) * 0.05)); }
    100%{ transform:translateX(0); }
  }

  .thumb-inner{
    width:100%; height:100%; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    position:relative;
    background:radial-gradient(circle at 32% 28%, var(--objection-light), var(--objection) 55%, #6e1c17 100%);
    box-shadow:0 6px 16px rgba(178,58,52,.45), inset 0 1px 2px rgba(255,255,255,.35), inset 0 -6px 10px rgba(0,0,0,.35);
    transition:background .4s ease, box-shadow .4s ease;
    transform:scale(1);
  }
  .pill.is-right .thumb-inner{
    background:radial-gradient(circle at 32% 28%, var(--condition-light), var(--condition) 55%, #0d4c3f 100%);
    box-shadow:0 6px 16px rgba(31,143,118,.45), inset 0 1px 2px rgba(255,255,255,.35), inset 0 -6px 10px rgba(0,0,0,.35);
  }
  .thumb-inner.glub{ animation:glub .56s cubic-bezier(.34,1.7,.4,1); }
  @keyframes glub{
    0%{ transform:scale(1); }
    28%{ transform:scaleX(1.32) scaleY(.78); }
    52%{ transform:scaleX(.84) scaleY(1.18); }
    74%{ transform:scaleX(1.1) scaleY(.94); }
    100%{ transform:scale(1); }
  }

  .thumb-inner svg{
    position:absolute; width:24px; height:24px; stroke:#160404;
    opacity:0; transform:scale(.5) rotate(-20deg);
    transition:opacity .22s ease, transform .3s cubic-bezier(.34,1.7,.4,1);
  }
  .thumb-inner svg.on{ opacity:1; transform:scale(1) rotate(0deg); }
  .pill.is-right .thumb-inner svg{ stroke:#04150f; }

  .pill .icon-slot svg{ stroke:var(--cream-dim); opacity:.55; transition:stroke .35s, opacity .35s, transform .35s; }
  .pill:not(.is-right) .icon-slot.left svg{ stroke:var(--objection-light); opacity:1; transform:scale(1.05); }
  .pill.is-right .icon-slot.right svg{ stroke:var(--condition-light); opacity:1; transform:scale(1.05); }

  .wheel-frame{
    position:relative;
    width:min(78vw, 460px);
    aspect-ratio:1/1;
    margin:38px 0 26px;
  }
  .glow-ring{
    position:absolute; inset:-22px;
    border-radius:50%;
    background:conic-gradient(from 0deg, transparent 0deg, rgba(201,162,39,.55) 30deg, transparent 70deg, transparent 360deg);
    filter:blur(6px);
    opacity:0;
    transition:opacity .4s;
  }
  .wheel-frame.spinning .glow-ring{ opacity:1; animation:spinGlow 1.1s linear infinite; }
  @keyframes spinGlow{ to{ transform:rotate(360deg); } }

  .bulbs{ position:absolute; inset:-14px; border-radius:50%; pointer-events:none; }
  .bulb{
    position:absolute; width:7px; height:7px; border-radius:50%;
    background:var(--gold-light);
    box-shadow:0 0 6px 1px rgba(240,210,122,.5);
    top:50%; left:50%;
    opacity:.35;
    animation:twinkle 2.6s ease-in-out infinite;
  }
  @keyframes twinkle{ 0%,100%{ opacity:.25; } 50%{ opacity:.85; } }
  .wheel-frame.spinning .bulb{ animation-duration:.5s; }

  .rim{
    position:absolute; inset:0; border-radius:50%;
    background:
      radial-gradient(circle at 50% 50%, transparent 92%, var(--gold) 93%, var(--gold-light) 95%, var(--gold-dark) 97%, transparent 98%);
    box-shadow:var(--shadow-deep);
    pointer-events:none;
  }

  .wheel-svg-wrap{
    position:absolute; inset:16px;
    border-radius:50%;
    overflow:hidden;
    box-shadow:0 0 0 6px #0c0c0e, 0 0 0 8px var(--gold-dark), inset 0 0 40px rgba(0,0,0,.6);
    background:#0c0c0e;
  }
  #wheel{ width:100%; height:100%; display:block; will-change:transform; }
  #wheel .seg-num{
    font-family:'Cinzel',serif; font-weight:700; fill:var(--cream); font-size:34px;
    paint-order:stroke; stroke:rgba(0,0,0,.35); stroke-width:1px;
  }

  .pointer{
    position:absolute; top:-6px; left:50%; transform:translateX(-50%);
    width:0; height:0; z-index:5;
    border-left:16px solid transparent;
    border-right:16px solid transparent;
    border-top:28px solid var(--gold-light);
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.6));
  }
  .pointer::after{
    content:""; position:absolute; left:-9px; top:-30px;
    width:18px; height:18px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff6d8, var(--gold) 60%, var(--gold-dark));
    box-shadow:0 2px 5px rgba(0,0,0,.5);
  }

  .hub{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:90px; height:90px; border-radius:50%;
    background:radial-gradient(circle at 35% 28%, #2a2a2f, #0c0c0e 70%);
    border:3px solid var(--gold);
    box-shadow:0 10px 26px rgba(0,0,0,.6), inset 0 2px 4px rgba(255,255,255,.08);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; z-index:6;
    transition:transform .15s ease;
  }
  .hub:active{ transform:translate(-50%,-50%) scale(.94); }
  .hub svg{ width:34px; height:34px; stroke:var(--gold-light); transition:transform .3s; }
  .hub.disabled{ cursor:not-allowed; opacity:.4; }
  .wheel-frame.spinning .hub svg{ animation:hubspin 1s linear infinite; }
  @keyframes hubspin{ to{ transform:rotate(360deg); } }

  .hint{
    font-size:12px; letter-spacing:.08em; color:var(--cream-dim); opacity:.6; text-transform:uppercase;
    margin-top:2px; text-align:center; min-height:16px;
  }

  .progress{ display:flex; gap:8px; margin-top:22px; flex-wrap:wrap; justify-content:center; max-width:360px; }
  .dot{
    width:14px; height:14px; border-radius:50%;
    background:#2a2a30; border:1px solid var(--panel-line);
    transition:background .3s, box-shadow .3s, transform .3s;
  }
  .dot.used{ background:var(--gold-dark); box-shadow:0 0 6px rgba(201,162,39,.4); transform:scale(.85); }
  .dot.current{ outline:2px solid var(--gold-light); outline-offset:2px; }

  .reset-btn{
    margin-top:26px; display:flex; align-items:center; gap:8px;
    background:transparent; border:1px solid var(--panel-line); color:var(--cream-dim);
    padding:9px 16px; border-radius:999px; font-family:'Inter'; font-size:12px; letter-spacing:.06em;
    cursor:pointer; transition:border-color .25s, color .25s, background .25s;
  }
  .reset-btn:hover{ border-color:var(--gold); color:var(--gold-light); background:rgba(201,162,39,.06); }
  .reset-btn svg{ width:14px; height:14px; stroke:currentColor; }

  .overlay{
    position:fixed; inset:0; z-index:50;
    background:rgba(4,4,5,.75);
    backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition:opacity .35s ease;
    padding:24px;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }

  .scroll-wrap{
    position:relative;
    width:min(92vw, 420px);
    perspective:1000px;
  }

  .scroll{
    position:relative;
    background:
      linear-gradient(180deg, #efe4c8, #e8dab5 40%, #ecdfbe 100%);
    color:#241a0d;
    border-radius:6px;
    padding:38px 30px 34px;
    box-shadow:0 30px 60px rgba(0,0,0,.55), inset 0 0 0 1px rgba(0,0,0,.06);
    transform:scaleY(.02);
    transform-origin:top center;
    opacity:0;
  }
  .overlay.show .scroll{ animation:unroll .85s cubic-bezier(.2,.85,.3,1.15) forwards; }
  @keyframes unroll{
    0%{ transform:scaleY(.02); opacity:0; }
    12%{ opacity:1; }
    60%{ transform:scaleY(1.06); }
    80%{ transform:scaleY(.97); }
    100%{ transform:scaleY(1); opacity:1; }
  }

  .scroll-rod{
    position:absolute; left:-14px; right:-14px; height:20px;
    background:linear-gradient(180deg,#8a6d16,#c9a227 45%,#6b530f);
    border-radius:10px;
    box-shadow:0 3px 8px rgba(0,0,0,.4);
  }
  .scroll-rod.top{ top:-10px; }
  .scroll-rod.bottom{ bottom:-10px; }
  .scroll-rod::before, .scroll-rod::after{
    content:""; position:absolute; top:-3px; width:20px; height:26px; border-radius:10px;
    background:linear-gradient(180deg,#f0d27a,#8a6d16);
    box-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  .scroll-rod::before{ left:-6px; }
  .scroll-rod::after{ right:-6px; }

  .scroll-tag{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'Inter'; font-weight:700; font-size:10px; letter-spacing:.14em; text-transform:uppercase;
    padding:5px 12px; border-radius:999px; margin-bottom:16px;
    opacity:0; transition:opacity .3s .5s;
  }
  .overlay.show .scroll-tag{ opacity:1; }
  .scroll-tag.objection{ background:rgba(178,58,52,.14); color:#8a2a25; border:1px solid rgba(178,58,52,.35); }
  .scroll-tag.condition{ background:rgba(31,143,118,.14); color:#146250; border:1px solid rgba(31,143,118,.35); }

  .scroll-number{
    font-family:'Cinzel',serif; font-weight:900; font-size:13px; letter-spacing:.1em; color:#8a6d16; opacity:0;
    transition:opacity .3s .55s; margin-bottom:6px; text-transform:uppercase;
  }
  .overlay.show .scroll-number{ opacity:.8; }

  .scroll-text{
    font-family:'Cinzel',serif; font-weight:700; font-size:clamp(20px,4.6vw,26px); line-height:1.35;
    opacity:0; transition:opacity .4s .6s, transform .4s .6s; transform:translateY(6px);
  }
  .overlay.show .scroll-text{ opacity:1; transform:translateY(0); }

  .scroll-close{
    margin-top:26px; display:flex; align-items:center; gap:8px;
    background:#241a0d; color:#efe4c8; border:none; padding:10px 20px; border-radius:999px;
    font-family:'Inter'; font-size:12px; letter-spacing:.06em; cursor:pointer;
    opacity:0; transition:opacity .3s .65s, transform .2s;
  }
  .overlay.show .scroll-close{ opacity:1; }
  .scroll-close:hover{ transform:translateY(-1px); }
  .scroll-close svg{ width:13px; height:13px; stroke:currentColor; }

  .scroll-texture{
    position:absolute; inset:0; border-radius:6px; pointer-events:none; mix-blend-mode:multiply; opacity:.5;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.02) 0 2px, transparent 2px 4px),
      radial-gradient(circle at 20% 30%, rgba(120,90,40,.08), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(120,90,40,.08), transparent 40%);
  }

  .done-msg{
    margin-top:16px; text-align:center; font-size:12px; letter-spacing:.05em; color:var(--gold-light); opacity:0; max-width:320px;
    transition:opacity .3s;
  }
  .done-msg.show{ opacity:1; }

  @media (max-width:480px){
    .pill{ --pill-w:170px; --pill-h:58px; --thumb:46px; }
    .wheel-frame{ width:88vw; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }
</style>
</head>
<body>

<div class="stage">
  <header>
    <p class="eyebrow">Academy</p>
    <h1>Roleta de Cenários</h1>
  </header>

  <div class="mode-wrap">
    <div class="mode-labels">
      <span class="lbl-obj active" id="lblObj">Objeção</span>
      <span class="lbl-cond" id="lblCond">Condição</span>
    </div>
    <div class="pill" id="modePill" role="button" tabindex="0" aria-label="Alternar entre Objeção e Condição">
      <span class="icon-slot left">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
          <line x1="12" y1="8" x2="12" y2="12.5"/>
          <circle cx="12" cy="15.2" r="0.6" fill="currentColor"/>
        </svg>
      </span>
      <span class="thumb" id="thumb">
        <span class="thumb-inner" id="thumbInner">
          <svg id="thumbIconObj" class="on" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
            <line x1="12" y1="8" x2="12" y2="12.5"/>
            <circle cx="12" cy="15.2" r="0.6" fill="currentColor"/>
          </svg>
          <svg id="thumbIconCond" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <circle cx="12" cy="12" r="5"/>
            <circle cx="12" cy="12" r="1" fill="currentColor"/>
          </svg>
        </span>
      </span>
      <span class="icon-slot right">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <circle cx="12" cy="12" r="5"/>
          <circle cx="12" cy="12" r="1" fill="currentColor"/>
        </svg>
      </span>
    </div>
  </div>

  <div class="wheel-frame" id="wheelFrame">
    <div class="glow-ring"></div>
    <div class="bulbs" id="bulbs"></div>
    <div class="rim"></div>
    <div class="wheel-svg-wrap">
      <svg id="wheel" viewBox="0 0 500 500"></svg>
    </div>
    <div class="pointer"></div>
    <div class="hub" id="hub" role="button" tabindex="0" aria-label="Girar a roleta">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="6 3 20 12 6 21 6 3"/>
      </svg>
    </div>
  </div>

  <p class="hint" id="hint">Toque no centro da roleta para girar</p>

  <div class="progress" id="progress"></div>

  <p class="done-msg" id="doneMsg">Todas as frases desta categoria já foram sorteadas.</p>

  <button class="reset-btn" id="resetBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="1 4 1 10 7 10"/>
      <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
    </svg>
    Reiniciar sorteio
  </button>
</div>

<div class="overlay" id="overlay">
  <div class="scroll-wrap">
    <div class="scroll">
      <div class="scroll-texture"></div>
      <div class="scroll-rod top"></div>
      <span class="scroll-tag" id="scrollTag">Objeção</span>
      <div class="scroll-number" id="scrollNumber">Número 1</div>
      <div class="scroll-text" id="scrollText">Frase sorteada aparece aqui.</div>
      <button class="scroll-close" id="scrollClose">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
        Fechar
      </button>
      <div class="scroll-rod bottom"></div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  const OBJECOES = [
    "Me manda a proposta que depois eu olho.",
    "Preciso conversar com minha esposa antes.",
    "Gostei de tudo, só não quero decidir hoje."
  ];

  const CONDICOES = [
    "Termine conduzindo para um próximo passo concreto e aplique senso de urgência.",
    "Não pode usar as frases “qualquer dúvida, me chama”, “você me avisa” ou equivalentes.",
    "Saia da conversa com compromissos firmados, data e horário de retomada combinados."
  ];

  const SEG_COUNT = OBJECOES.length;
  const SEG_ANGLE = 360 / SEG_COUNT;
  const R = 250, CX = 250, CY = 250, RADIUS = 240;

  const usedObj = new Set();
  const usedCond = new Set();

  let mode = "obj";
  let currentRotation = 0;
  let spinning = false;
  let lastTickIndex = null;
  let animFrame = null;

  let actx = null;
  function audio(){
    if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === "suspended") actx.resume();
    return actx;
  }

  function tickSound(){
    const ctx = audio();
    const t = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(1450, t);
    osc.frequency.exponentialRampToValueAtTime(600, t + 0.03);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.22, t + 0.004);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + 0.05);
  }

  function whooshSound(){
    const ctx = audio();
    const t = ctx.currentTime;
    const dur = 0.9;
    const bufferSize = ctx.sampleRate * dur;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * (1 - i/bufferSize); }
    const noise = ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.setValueAtTime(1800, t);
    filter.frequency.exponentialRampToValueAtTime(400, t + dur);
    filter.Q.value = 0.7;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.35, t + 0.08);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    noise.connect(filter).connect(gain).connect(ctx.destination);
    noise.start(t);
    noise.stop(t + dur);
  }

  function crinkleSound(){
    const ctx = audio();
    const t = ctx.currentTime;
    for(let i=0;i<7;i++){
      const start = t + i*0.045 + Math.random()*0.02;
      const dur = 0.03 + Math.random()*0.03;
      const bufferSize = Math.floor(ctx.sampleRate * dur);
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for(let j=0;j<bufferSize;j++){ data[j] = (Math.random()*2-1); }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = "highpass";
      filter.frequency.value = 2500 + Math.random()*2000;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.18, start);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      noise.connect(filter).connect(gain).connect(ctx.destination);
      noise.start(start);
      noise.stop(start + dur);
    }
  }

  function clickSound(){
    const ctx = audio();
    const t = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(700, t);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.15, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + 0.1);
  }

  const wheelEl = document.getElementById("wheel");
  const segColors = [];
  for(let i=0;i<SEG_COUNT;i++){
    const hue = Math.round(i * (360/SEG_COUNT) + 8);
    segColors.push(`hsl(${hue}, 58%, 30%)`);
  }
  const segColorsDim = segColors.map(()=> "hsl(0, 0%, 18%)");

  function polar(cx, cy, r, angleDeg){
    const rad = (angleDeg - 90 + 90) * Math.PI/180;
    const a = (angleDeg) * Math.PI/180;
    return { x: cx + r*Math.sin(a), y: cy - r*Math.cos(a) };
  }

  const numberPositions = [];

  function buildWheel(){
    const svgNS = "http://www.w3.org/2000/svg";
    wheelEl.innerHTML = "";
    numberPositions.length = 0;
    const g = document.createElementNS(svgNS, "g");
    g.setAttribute("id", "wheelGroup");

    for(let i=0;i<SEG_COUNT;i++){
      const start = i * SEG_ANGLE;
      const end = start + SEG_ANGLE;
      const p1 = polar(CX, CY, RADIUS, start);
      const p2 = polar(CX, CY, RADIUS, end);
      const path = document.createElementNS(svgNS, "path");
      const d = `M ${CX} ${CY} L ${p1.x.toFixed(2)} ${p1.y.toFixed(2)} A ${RADIUS} ${RADIUS} 0 0 1 ${p2.x.toFixed(2)} ${p2.y.toFixed(2)} Z`;
      path.setAttribute("d", d);
      path.setAttribute("fill", segColors[i]);
      path.setAttribute("stroke", "#0c0c0e");
      path.setAttribute("stroke-width", "2");
      path.setAttribute("class", "seg");
      path.setAttribute("data-index", i);
      g.appendChild(path);

      const mid = start + SEG_ANGLE/2;
      const tp = polar(CX, CY, RADIUS*0.7, mid);
      numberPositions[i] = tp;

      const numGroup = document.createElementNS(svgNS, "g");
      numGroup.setAttribute("class", "num-group");
      numGroup.setAttribute("data-index", i);
      numGroup.setAttribute("transform", `translate(${tp.x.toFixed(2)} ${tp.y.toFixed(2)})`);

      const text = document.createElementNS(svgNS, "text");
      text.setAttribute("x", 0);
      text.setAttribute("y", 0);
      text.setAttribute("class", "seg-num");
      text.setAttribute("text-anchor", "middle");
      text.setAttribute("dominant-baseline", "middle");
      text.setAttribute("data-index", i);
      text.textContent = (i+1);
      numGroup.appendChild(text);
      g.appendChild(numGroup);
    }
    wheelEl.appendChild(g);
    updateNumberRotations(currentRotation);
  }

  function updateNumberRotations(rot){
    const groups = wheelEl.querySelectorAll(".num-group");
    for(let i=0;i<groups.length;i++){
      const idx = parseInt(groups[i].getAttribute("data-index"), 10);
      const p = numberPositions[idx];
      if(!p) continue;
      groups[i].setAttribute("transform", `translate(${p.x.toFixed(2)} ${p.y.toFixed(2)}) rotate(${-rot})`);
    }
  }
  buildWheel();

  function refreshSegmentStyles(){
    const used = mode === "obj" ? usedObj : usedCond;
    document.querySelectorAll("#wheel .seg").forEach(seg=>{
      const idx = parseInt(seg.getAttribute("data-index"), 10);
      if(used.has(idx)){
        seg.setAttribute("fill", "hsl(0,0%,16%)");
        seg.style.opacity = "0.55";
      } else {
        seg.setAttribute("fill", segColors[idx]);
        seg.style.opacity = "1";
      }
    });
    document.querySelectorAll("#wheel .seg-num").forEach(t=>{
      const idx = parseInt(t.getAttribute("data-index"), 10);
      t.style.opacity = used.has(idx) ? "0.35" : "1";
    });
  }

  const bulbsEl = document.getElementById("bulbs");
  const BULB_COUNT = 28;
  for(let i=0;i<BULB_COUNT;i++){
    const angle = (360/BULB_COUNT) * i;
    const b = document.createElement("div");
    b.className = "bulb";
    const rad = (angle) * Math.PI/180;
    const rr = 49.7;
    const x = 50 + rr*Math.sin(rad);
    const y = 50 - rr*Math.cos(rad);
    b.style.left = x + "%";
    b.style.top = y + "%";
    b.style.animationDelay = (i * 0.09) + "s";
    bulbsEl.appendChild(b);
  }

  const progressEl = document.getElementById("progress");
  function renderProgress(){
    progressEl.innerHTML = "";
    const used = mode === "obj" ? usedObj : usedCond;
    for(let i=0;i<SEG_COUNT;i++){
      const d = document.createElement("div");
      d.className = "dot" + (used.has(i) ? " used" : "");
      progressEl.appendChild(d);
    }
  }
  renderProgress();
  refreshSegmentStyles();

  const pill = document.getElementById("modePill");
  const thumb = document.getElementById("thumb");
  const thumbInner = document.getElementById("thumbInner");
  const thumbIconObj = document.getElementById("thumbIconObj");
  const thumbIconCond = document.getElementById("thumbIconCond");
  const lblObj = document.getElementById("lblObj");
  const lblCond = document.getElementById("lblCond");
  const hint = document.getElementById("hint");
  const doneMsg = document.getElementById("doneMsg");

  function playGlub(){
    thumbInner.classList.remove("glub");
    void thumbInner.offsetWidth;
    thumbInner.classList.add("glub");
  }

  thumb.addEventListener("animationend", (e)=>{
    if(e.animationName !== "slideRight" && e.animationName !== "slideLeft") return;
    thumb.classList.remove("slide-right", "slide-left");
    const isRight = pill.classList.contains("is-right");
    thumbIconObj.classList.toggle("on", !isRight);
    thumbIconCond.classList.toggle("on", isRight);
    playGlub();
  });

  function setMode(newMode){
    if(spinning) return;
    if(newMode === mode) return;
    mode = newMode;
    const isRight = mode === "cond";
    pill.classList.toggle("is-right", isRight);
    lblObj.classList.toggle("active", !isRight);
    lblCond.classList.toggle("active", isRight);

    thumbIconObj.classList.remove("on");
    thumbIconCond.classList.remove("on");

    thumb.classList.remove("slide-right", "slide-left");
    void thumb.offsetWidth;
    thumb.classList.add(isRight ? "slide-right" : "slide-left");

    try{ clickSound(); }catch(e){}
    renderProgress();
    refreshSegmentStyles();
    updateHint();
  }

  pill.addEventListener("click", (e)=>{
    const rect = pill.getBoundingClientRect();
    const x = e.clientX - rect.left;
    setMode(x > rect.width/2 ? "cond" : "obj");
  });
  pill.addEventListener("keydown", (e)=>{
    if(e.key === "ArrowRight") setMode("cond");
    if(e.key === "ArrowLeft") setMode("obj");
    if(e.key === "Enter" || e.key === " ") setMode(mode === "obj" ? "cond" : "obj");
  });

  function updateHint(){
    const used = mode === "obj" ? usedObj : usedCond;
    if(used.size >= SEG_COUNT){
      hint.textContent = "";
      doneMsg.classList.add("show");
    } else {
      doneMsg.classList.remove("show");
      hint.textContent = spinning ? "Girando..." : "Toque no centro da roleta para girar";
    }
  }

  const wheelFrame = document.getElementById("wheelFrame");
  const wheelGroupSelector = ()=> document.getElementById("wheelGroup");
  const hub = document.getElementById("hub");

  function easeOutCubicElastic(t){
    return 1 - Math.pow(1 - t, 3.2);
  }

  function currentSegIndexForRotation(rot){
    const mod = ((rot % 360) + 360) % 360;
    const topAngle = ((360 - mod) % 360);
    return Math.floor(topAngle / SEG_ANGLE) % SEG_COUNT;
  }

  function spin(){
    if(spinning) return;
    const used = mode === "obj" ? usedObj : usedCond;
    const pool = [];
    for(let i=0;i<SEG_COUNT;i++) if(!used.has(i)) pool.push(i);
    if(pool.length === 0){
      updateHint();
      return;
    }
    const targetIndex = pool[Math.floor(Math.random()*pool.length)];

    spinning = true;
    hint.textContent = "Girando...";
    wheelFrame.classList.add("spinning");
    hub.classList.add("disabled");

    const segCenter = targetIndex * SEG_ANGLE + SEG_ANGLE/2;
    const requiredMod = (360 - segCenter) % 360;
    const spins = 6 + Math.floor(Math.random()*2);
    let base = Math.ceil((currentRotation+1)/360)*360;
    let target = base + 360*spins + requiredMod;
    while(target <= currentRotation + 360*4) target += 360;

    const startRotation = currentRotation;
    const delta = target - startRotation;
    const duration = 5200 + Math.random()*600;
    const startTime = performance.now();
    lastTickIndex = currentSegIndexForRotation(startRotation);

    function frame(now){
      const elapsed = now - startTime;
      const t = Math.min(elapsed / duration, 1);
      const eased = easeOutCubicElastic(t);
      const rot = startRotation + delta * eased;
      currentRotation = rot;
      const grp = wheelGroupSelector();
      if(grp) grp.setAttribute("transform", `rotate(${rot} ${CX} ${CY})`);
      updateNumberRotations(rot);

      const idx = currentSegIndexForRotation(rot);
      if(idx !== lastTickIndex){
        lastTickIndex = idx;
        try{ tickSound(); }catch(e){}
      }

      if(t < 1){
        animFrame = requestAnimationFrame(frame);
      } else {
        currentRotation = target;
        const grp2 = wheelGroupSelector();
        if(grp2) grp2.setAttribute("transform", `rotate(${target} ${CX} ${CY})`);
        updateNumberRotations(target);
        finishSpin(targetIndex);
      }
    }
    animFrame = requestAnimationFrame(frame);
  }

  function finishSpin(index){
    spinning = false;
    wheelFrame.classList.remove("spinning");
    hub.classList.remove("disabled");

    const used = mode === "obj" ? usedObj : usedCond;
    used.add(index);
    renderProgress();
    refreshSegmentStyles();
    updateHint();

    const phrase = (mode === "obj" ? OBJECOES : CONDICOES)[index];
    openScroll(mode, index, phrase);
  }

  hub.addEventListener("click", spin);
  hub.addEventListener("keydown", (e)=>{ if(e.key === "Enter" || e.key === " ") spin(); });

  const overlay = document.getElementById("overlay");
  const scrollTag = document.getElementById("scrollTag");
  const scrollNumber = document.getElementById("scrollNumber");
  const scrollText = document.getElementById("scrollText");
  const scrollClose = document.getElementById("scrollClose");

  function openScroll(m, index, phrase){
    scrollTag.textContent = m === "obj" ? "Objeção" : "Condição";
    scrollTag.className = "scroll-tag " + (m === "obj" ? "objection" : "condition");
    scrollNumber.textContent = "Número " + (index+1);
    scrollText.textContent = phrase;
    overlay.classList.add("show");
    try{ whooshSound(); setTimeout(crinkleSound, 120); }catch(e){}
  }
  function closeScroll(){
    overlay.classList.remove("show");
  }
  scrollClose.addEventListener("click", closeScroll);
  overlay.addEventListener("click", (e)=>{ if(e.target === overlay) closeScroll(); });
  document.addEventListener("keydown", (e)=>{ if(e.key === "Escape") closeScroll(); });

  document.getElementById("resetBtn").addEventListener("click", ()=>{
    if(spinning) return;
    usedObj.clear();
    usedCond.clear();
    renderProgress();
    refreshSegmentStyles();
    updateHint();
    closeScroll();
    try{ clickSound(); }catch(e){}
  });

  updateHint();
})();
</script>
</body>
